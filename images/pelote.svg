<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Pelote / Ball of yarn for workshops -->
  <defs>
    <style>
      .yarn { fill: #FE7B7E; stroke: #2B2B2B; stroke-width: 1.5; }
      .yarn-accent { fill: #85D6CD; stroke: #2B2B2B; stroke-width: 1.5; }
    </style>
  </defs>
  
  <!-- Yarn ball -->
  <circle cx="100" cy="90" r="50" class="yarn"/>
  <circle cx="85" cy="70" r="30" class="yarn-accent" opacity="0.7"/>
  <circle cx="115" cy="75" r="28" class="yarn" opacity="0.8"/>
  
  <!-- Yarn strand -->
  <path d="M 140 120 Q 160 100, 170 60" stroke="#2B2B2B" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="170" cy="55" r="8" fill="#FE7B7E" stroke="#2B2B2B" stroke-width="1.5"/>
</svg>