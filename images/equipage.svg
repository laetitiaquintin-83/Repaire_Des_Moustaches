<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Equipage / Cats -->
  <defs>
    <style>
      .cat { fill: #FE7B7E; }
      .cat-detail { fill: #2B2B2B; }
      .cat-pink { fill: #85D6CD; }
    </style>
  </defs>
  
  <!-- Center cat (main) -->
  <circle cx="100" cy="110" r="35" class="cat"/>
  <!-- Head -->
  <circle cx="100" cy="70" r="25" class="cat"/>
  <!-- Ears -->
  <polygon points="80,45 70,20 85,40" class="cat"/>
  <polygon points="120,45 130,20 115,40" class="cat"/>
  <!-- Eyes -->
  <circle cx="93" cy="65" r="3" class="cat-detail"/>
  <circle cx="107" cy="65" r="3" class="cat-detail"/>
  <!-- Mouth -->
  <path d="M 100 75 Q 95 80 90 78" stroke="#2B2B2B" stroke-width="2" fill="none"/>
  <path d="M 100 75 Q 105 80 110 78" stroke="#2B2B2B" stroke-width="2" fill="none"/>
  
  <!-- Left cat -->
  <circle cx="45" cy="120" r="20" class="cat-pink"/>
  <circle cx="45" cy="100" r="15" class="cat-pink"/>
  <polygon points="35,90 28,75 38,88" class="cat-pink"/>
  <circle cx="41" cy="96" r="2" class="cat-detail"/>
  
  <!-- Right cat -->
  <circle cx="155" cy="120" r="20" class="cat-pink"/>
  <circle cx="155" cy="100" r="15" class="cat-pink"/>
  <polygon points="165,90 172,75 162,88" class="cat-pink"/>
  <circle cx="159" cy="96" r="2" class="cat-detail"/>
</svg>