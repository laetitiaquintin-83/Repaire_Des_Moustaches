<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Logo: Stylized cat face with moustache -->
  <defs>
    <style>
      .logo-cat { fill: #FE7B7E; }
      .logo-detail { fill: #2B2B2B; }
      .logo-accent { fill: #85D6CD; }
    </style>
  </defs>
  
  <!-- Head -->
  <circle cx="100" cy="100" r="60" class="logo-cat"/>
  
  <!-- Ears -->
  <polygon points="60,50 40,20 55,55" class="logo-cat"/>
  <polygon points="140,50 160,20 145,55" class="logo-cat"/>
  
  <!-- Eyes -->
  <circle cx="80" cy="85" r="8" class="logo-detail"/>
  <circle cx="120" cy="85" r="8" class="logo-detail"/>
  <!-- Eye shine -->
  <circle cx="82" cy="83" r="3" class="logo-accent"/>
  <circle cx="122" cy="83" r="3" class="logo-accent"/>
  
  <!-- Nose -->
  <polygon points="100,105 95,115 105,115" class="logo-detail"/>
  
  <!-- Moustache (iconic!) -->
  <path d="M 100,110 Q 70,105 50,115" stroke="#2B2B2B" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 100,110 Q 130,105 150,115" stroke="#2B2B2B" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Mouth -->
  <path d="M 100,115 Q 95,125 90,123" stroke="#2B2B2B" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 100,115 Q 105,125 110,123" stroke="#2B2B2B" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>