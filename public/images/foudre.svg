<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Foudre / Lightning bolt for "Coup de Foudre" (love at first sight) -->
  <defs>
    <style>
      .lightning { fill: #FE7B7E; }
      .lightning-glow { fill: #FFF8E7; opacity: 0.6; }
    </style>
  </defs>
  
  <!-- Lightning bolt -->
  <polygon points="100,20 70,80 90,80 60,180 140,100 110,100 130,30" class="lightning"/>
  
  <!-- Glow effect -->
  <polygon points="100,35 85,70 95,70 75,145 125,100 115,100 125,45" class="lightning-glow"/>
  
  <!-- Heart inside -->
  <path d="M 100,90 L 95,100 Q 90,105 85,102 Q 80,99 80,95 Q 80,88 85,85 Q 90,82 95,82 Q 100,82 100,88 Q 100,82 105,82 Q 110,82 115,85 Q 120,88 120,95 Q 120,99 115,102 Q 110,105 105,100 Z" fill="#85D6CD" opacity="0.8"/>
</svg>